# VETTED — the Fullstory MCP, EVERY tool it serves, as Sekizui governs them (D289, D305-D308).
#
# A CONFIG FRAGMENT: drop it into a deployment's config directory (D278) beside a target named
# `fullstory-mcp` (kind: mcp, base_url: https://api.fullstory.com/mcp/fullstory, settings: {org_id: <yours>},
# credential: the org's client-credentials grant, D307). P3 step 25 loads THIS FILE, so what ships is what
# is tested. It replaces `session-review.yaml` (D289's six tools) and the observation-drafted
# `discover_org_context.yaml`: one file, because D278 refuses a second fragment for the same target.
#
# THE CONNECTOR SHIPS EVERYTHING; THE DEPLOYMENT DECIDES WHAT IS EXPOSED (the maintainer, D308). Every tool Fullstory
# serves is here, and every data_schema is the vendor's full schema. Grants decide who may call a tool,
# lenses what a consumer receives, anzen what nobody may do.
#
# PROVENANCE, per tool:
#   - input_schema: copied from the live tools/list, 2026-09-26, and drift-checked at readiness.
#   - native: [opaque] on every tool, the DRAFTED SAFE ANSWER (D323, D324): where this server shares a
#     budget with a native Fullstory target, a caller must hold that target's whole surface to use a tool.
#     Narrow a tool to the native actions it mirrors, or [none], only on review by someone who knows what
#     it reaches. Inert where no native Fullstory target is linked; an unlinked deployment that also runs
#     one must link them or declare [none] (D324).
#   - output_schema: COPIED from the live tools/list (origin vendor) for the 30 JSON tools. Fullstory now
#     advertises outputSchema; it did not on 2026-09-24, when D289 inferred three of them.
#   - data_schema: the closed subset of the output schema, local $refs EXPANDED and recursion unrolled
#     once (D306), so compute_metric's and compute_funnel's numbers are admitted.
#   - text tools (tree, diff, screenshot): exactly as D289 vetted them; user_content, the signed URL
#     callerOnly.
#
# CLASSIFICATION, a human's (4.9a.1, D307): session_open allocates a concurrent-session slot (mutating,
# never retried) and session_close releases it (repeat-safe). The eight build_*/update_* tools SAVE an
# unnamed object in the org: mutating, idempotency none until anyone knows whether their returned hash is
# content-addressed. The rest read.
#
# THE HANDLE LIFECYCLE (D291): session_open OPENS client_id, session_close CLOSES it; any principal granted
# session_open must be granted session_close.
#
# org_id IS PINNED on every tool that takes one: the MCP reaches any org its credential can access, by argument, and one target is one
# org. get_sessions_for_journey and update_journey take no org_id; they act on the credential's own org,
# so there is nothing to pin. `session_view` is excluded: Fullstory deprecated it into session_screenshot
# and session_get_a11y_tree, and serves a stub that renders nothing.
mcp_specs:
  fullstory-mcp:
    server: fullstory
    host: api.fullstory.com
    tools:
      - name: build_funnel
        native: [opaque]
        description: "Build a funnel from a natural-language description and SAVE it as an unnamed funnel in the org; returns its id for compute_funnel."
        mutating: true
        idempotency: none
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"aggregation":{"type":"string","description":"How funnel conversion is counted: unique_users (default) or unique_sessions.","enum":["unique_users","unique_sessions"]},"description":{"type":"string","description":"Optional longer description of the funnel. This can provide additional context when viewing the funnel in the UI."},"end_date":{"type":"string","description":"Custom range end date (ISO 8601, e.g. 2025-03-31). Must be paired with start_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"in_same_session":{"type":"boolean","description":"Whether funnel steps must occur within the same session. Defaults to true. Pass false for cross-session flows (e.g. 'signed up then purchased within 7 days')."},"name":{"type":"string","description":"Funnel name. If omitted, a name is generated from the query."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"query":{"type":"string","description":"Natural-language funnel description. Describe the ordered sequence of events. Example: 'users who visited the pricing page, then clicked Sign Up, then submitted the form'."},"segment_id":{"type":"string","description":"Optional segment id to scope the funnel to. For exclusions ('excluding users who did X'), call build_segment first to get the segment_id, then pass it here. The funnel builder calls set_segment internally with this id."},"start_date":{"type":"string","description":"Custom range start date (ISO 8601, e.g. 2025-01-01). Must be paired with end_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"time_range":{"type":"string","description":"Preset time window. Defaults to last_30_days if omitted.","enum":["last_24_hours","last_day","last_7_days","last_30_days","last_90_days","last_year","this_month"]},"within_seconds":{"type":"integer","description":"Conversion time window: the whole funnel must complete within this many seconds (e.g. 300 for 'within 5 minutes'). Overrides any window inferred from the query. Pass 0 to remove an inferred window. Omit to keep any window the query implies."}},"required":["query"]}
        output_type: fullstory.mcp.build_funnel.v1
        output_schema_origin: vendor
        output_schema: {"properties":{"aggregation":{"description":"The funnel's aggregation: unique_users or unique_sessions.","type":"string"},"funnel_definition":{"description":"The funnel definition as structured JSON.","properties":{},"type":"object"},"funnel_description":{"description":"Optional longer description for the funnel.","type":"string"},"funnel_id":{"description":"ID (hash) of the saved unnamed funnel. Pass to compute_funnel or get_funnel_sessions.","type":"string"},"funnel_name":{"description":"Descriptive name for the funnel.","type":"string"},"funnel_url":{"description":"URL to view the funnel in the Fullstory UI.","type":"string"}},"required":["funnel_definition","funnel_id","funnel_name","funnel_url"],"type":"object"}
        data_schema: {"properties":{"aggregation":{"description":"The funnel's aggregation: unique_users or unique_sessions.","type":"string"},"funnel_definition":{"description":"The funnel definition as structured JSON.","properties":{},"type":"object"},"funnel_description":{"description":"Optional longer description for the funnel.","type":"string"},"funnel_id":{"description":"ID (hash) of the saved unnamed funnel. Pass to compute_funnel or get_funnel_sessions.","type":"string"},"funnel_name":{"description":"Descriptive name for the funnel.","type":"string"},"funnel_url":{"description":"URL to view the funnel in the Fullstory UI.","type":"string"}},"type":"object"}
      - name: build_journey
        native: [opaque]
        description: "Build a journey from a natural-language description and SAVE it as an unnamed journey in the org; returns its id for compute_journey."
        mutating: true
        idempotency: none
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"description":{"type":"string","description":"Optional longer description of the journey (max 200 characters)."},"direction":{"type":"string","description":"start (steps following the pivot — 'starts with') or end (steps preceding it — 'ends with'). If omitted, the agent infers it from the query, defaulting to start.","enum":["start","end"]},"end_date":{"type":"string","description":"Custom range end date (ISO 8601, e.g. 2025-03-31). Must be paired with start_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"name":{"type":"string","description":"Journey name. If omitted, a name is generated from the pivot."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"query":{"type":"string","description":"Natural-language journey description. Describe the anchor event (the pivot) and, if relevant, the direction. Example: 'what do users do after visiting the pricing page' or 'what led users to submit the signup form'."},"segment_id":{"type":"string","description":"Optional segment id to scope the journey to. For exclusions ('excluding users who did X'), call build_segment first to get the segment_id, then pass it here. The journey builder calls set_segment internally with this id."},"start_date":{"type":"string","description":"Custom range start date (ISO 8601, e.g. 2025-01-01). Must be paired with end_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"time_range":{"type":"string","description":"Preset time window. Defaults to last_7_days if omitted.","enum":["last_24_hours","last_day","last_7_days","last_30_days","last_90_days","last_year","this_month"]}},"required":["query"]}
        output_type: fullstory.mcp.build_journey.v1
        output_schema_origin: vendor
        output_schema: {"properties":{"direction":{"description":"start or end — the direction the journey expands from its pivot.","enum":["start","end"],"type":"string"},"journey_id":{"description":"ID (hash) of the saved unnamed journey. Pass to compute_journey or get_journey.","type":"string"},"journey_name":{"description":"Descriptive name for the journey.","type":"string"},"journey_url":{"description":"URL to view the journey in the FullStory UI.","type":"string"}},"required":["direction","journey_id","journey_name","journey_url"],"type":"object"}
        data_schema: {"properties":{"direction":{"description":"start or end — the direction the journey expands from its pivot.","type":"string"},"journey_id":{"description":"ID (hash) of the saved unnamed journey. Pass to compute_journey or get_journey.","type":"string"},"journey_name":{"description":"Descriptive name for the journey.","type":"string"},"journey_url":{"description":"URL to view the journey in the FullStory UI.","type":"string"}},"type":"object"}
      - name: build_metric
        native: [opaque]
        description: "Build a metric from a natural-language description and SAVE it as an unnamed metric in the org; returns its id for compute_metric."
        mutating: true
        idempotency: none
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"end_date":{"type":"string","description":"Custom range end date (ISO 8601, e.g. 2025-03-31). Must be paired with start_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"metric_description":{"type":"string","description":"Optional longer description of the metric. This can provide additional context when viewing the metric in the UI."},"metric_name":{"type":"string","description":"Descriptive name for the metric. If omitted, a name is generated from the query."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"output_type":{"type":"string","description":"Shape of the result.","enum":["single_number","top_n","trend"]},"query":{"type":"string","description":"Natural language description of what to measure. Include the event type (clicks, errors, page views), any page/element/URL constraints, aggregation (count, average, unique users), and grouping (by page, by element, by browser). Example: 'dead clicks on the checkout page'. For rates/ratios/percentages pass the phrasing verbatim — build_metric builds the numerator and denominator; never simplify a '… rate' into a raw count."},"segment_id":{"type":"string","description":"Optional segment id to scope the metric to. Use when you need to restrict the metric to a named cohort or apply a behavioral exclusion. For exclusions ('excluding users who did X'), call build_segment first to get the segment_id, then pass it here. The metric builder calls set_segment internally with this id."},"start_date":{"type":"string","description":"Custom range start date (ISO 8601, e.g. 2025-01-01). Must be paired with end_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"time_range":{"type":"string","description":"Preset time window. Defaults to last_30_days if omitted.","enum":["last_24_hours","last_day","last_7_days","last_30_days","last_90_days","last_year","this_month"]}},"required":["output_type","query"]}
        output_type: fullstory.mcp.build_metric.v1
        output_schema_origin: vendor
        output_schema: {"properties":{"metric_definition":{"description":"The metric definition as structured JSON. Pass this to compute_metric.","properties":{},"type":"object"},"metric_description":{"description":"Optional longer description for the metric.","type":"string"},"metric_id":{"description":"The ID (hash) of the saved unnamed metric. Use this to reference the metric in URLs.","type":"string"},"metric_name":{"description":"Descriptive name for the metric.","type":"string"},"metric_url":{"description":"URL to view the metric in the Fullstory UI.","type":"string"},"output_type":{"description":"The output type: single_number, top_n, or trend.","type":"string"}},"required":["metric_definition","metric_id","metric_name","metric_url","output_type"],"type":"object"}
        data_schema: {"properties":{"metric_definition":{"description":"The metric definition as structured JSON. Pass this to compute_metric.","properties":{},"type":"object"},"metric_description":{"description":"Optional longer description for the metric.","type":"string"},"metric_id":{"description":"The ID (hash) of the saved unnamed metric. Use this to reference the metric in URLs.","type":"string"},"metric_name":{"description":"Descriptive name for the metric.","type":"string"},"metric_url":{"description":"URL to view the metric in the Fullstory UI.","type":"string"},"output_type":{"description":"The output type: single_number, top_n, or trend.","type":"string"}},"type":"object"}
      - name: build_segment
        native: [opaque]
        description: "Build a segment from a natural-language description and SAVE it as an unnamed segment in the org; returns its id for get_sessions."
        mutating: true
        idempotency: none
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"description":{"type":"string","description":"Optional longer description of the segment. This can provide additional context when viewing the segment in the UI. When the segment filters on named pages, name the RESOLVED page(s) with their ids (e.g. 'Views of Login (page 1245)') — describe the filter actually built, not the user's phrasing."},"end_date":{"type":"string","description":"Custom range end date (ISO 8601, e.g. 2025-03-31). Must be paired with start_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"name":{"type":"string","description":"Segment name. If omitted, a name is generated from the query."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"query":{"type":"string","description":"Natural language segment description. Include who (user properties), what (behaviors like clicks, rage clicks, errors), where (pages/URLs), and when (time range). Keep occurrence-count + window phrasing VERBATIM (e.g. 'visited /pricing at least 3 times within 7 days') — do not strip the 'at least N times in/within Y' part. Example: 'users who rage clicked on checkout in the last 30 days'"},"start_date":{"type":"string","description":"Custom range start date (ISO 8601, e.g. 2025-01-01). Must be paired with end_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"time_range":{"type":"string","description":"Preset time window for the WHOLE segment (recency scope). Defaults to last_30_days if omitted. Do NOT set this from a duration attached to an occurrence count ('N times in/within Y') — that window belongs in the query.","enum":["last_24_hours","last_day","last_7_days","last_30_days","last_90_days","last_year","this_month"]}},"required":["query"]}
        output_type: fullstory.mcp.build_segment.v1
        output_schema_origin: vendor
        output_schema: {"properties":{"definition":{"description":"The segment definition as structured JSON.","properties":{},"type":"object"},"segment_description":{"description":"Optional longer description for the segment.","type":"string"},"segment_id":{"description":"ID of the saved segment. Use this to reference the segment in subsequent tools.","type":"string"},"segment_name":{"description":"Descriptive name for the segment.","type":"string"},"segment_url":{"description":"URL to view the segment in Fullstory.","type":"string"}},"required":["definition","segment_id","segment_name","segment_url"],"type":"object"}
        data_schema: {"properties":{"definition":{"description":"The segment definition as structured JSON.","properties":{},"type":"object"},"segment_description":{"description":"Optional longer description for the segment.","type":"string"},"segment_id":{"description":"ID of the saved segment. Use this to reference the segment in subsequent tools.","type":"string"},"segment_name":{"description":"Descriptive name for the segment.","type":"string"},"segment_url":{"description":"URL to view the segment in Fullstory.","type":"string"}},"type":"object"}
      - name: compute_funnel
        native: [opaque]
        description: "Run a saved funnel and return per-step counts and conversion rates."
        mutating: false
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"compare_to":{"type":"string","description":"Optional prior period to compare against. When set, each step gains a \"previous\" object with the same metrics computed over that earlier window. Omit for a single-snapshot result.","enum":["previous_day","previous_week","previous_month","previous_quarter","previous_year"]},"dimension":{"type":"object","properties":{"apply_to_steps":{"type":"array","items":{"type":"integer","description":"0-indexed steps the breakdown applies to. Omit for all steps; [0] for the entry step only."},"description":"0-indexed steps the breakdown applies to. Omit for all steps; [0] for the entry step only."},"field_name":{"type":"string","description":"Storage slug for a custom-var dimension (page_var, elem_var, user_var, event_var). Ignored for built-in properties."},"limit":{"type":"integer","description":"Top-N groups to return, ranked by count. Defaults to 50."},"property":{"type":"string","description":"Property to break down by, e.g. browser, device, os, country, city, referrer_host, utm_source, url_path. Custom-var dimensions (page_var, elem_var, user_var, event_var) also require field_name."}},"description":"Optional group-by breakdown. When set, each step gains a \"groups\" array. Omit for the global aggregate.","required":["property"]},"funnel_id":{"type":"string","description":"ID of a saved funnel returned by build_funnel or get_funnel."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"segment_id":{"type":"string","description":"ID of a saved segment returned by build_segment or get_segment. When supplied, results are scoped to users in that segment. Omit for the global aggregate."}},"required":["funnel_id"]}
        output_type: fullstory.mcp.compute_funnel.v1
        output_schema_origin: vendor
        output_schema: {"$defs":{"FunnelStepResult":{"description":"Per-step computed metrics in order.","properties":{"conversion_from_first":{"description":"Percent (0-100) of step 1 that also reached this step. Omitted for step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of the previous step that also reached this step. Omitted for step 1.","type":"number"},"groups":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","items":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","properties":{"conversion_from_first":{"description":"Percent (0-100) of this group at step 1 that also reached this step. Omitted for step 1 and when the group is absent at step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of this group at the previous step that also reached this step. Omitted for step 1 and when the group is absent earlier.","type":"number"},"group_value":{"description":"The dimension value for this group, e.g. \"Chrome\".","type":"string"},"user_count":{"description":"Count of users or sessions in this group that reached the step.","type":"number"}},"required":["group_value","user_count"],"type":"object"},"type":"array"},"median_time_to_complete_from_first_ms":{"description":"Median milliseconds from step 1 to this step. Omitted for step 1 and when no data.","type":"integer"},"median_time_to_complete_from_previous_ms":{"description":"Median milliseconds from the previous step to this step. Omitted for step 1 and when no data.","type":"integer"},"previous":{"$ref":"#/$defs/FunnelStepResult"},"step_number":{"description":"1-indexed step position in the funnel.","type":"integer"},"user_count":{"description":"Count of users or sessions (depending on the funnel's aggregation) that reached this step.","type":"number"}},"required":["step_number","user_count"],"type":"object"}},"properties":{"funnel_id":{"description":"Funnel ID that was computed.","type":"string"},"funnel_name":{"description":"Display name of the funnel, when saved with one.","type":"string"},"funnel_url":{"description":"URL to view the funnel in the Fullstory UI.","type":"string"},"steps":{"description":"Per-step computed metrics in order.","items":{"$ref":"#/$defs/FunnelStepResult"},"type":"array"}},"required":["funnel_id","steps"],"type":"object"}
        data_schema: {"properties":{"funnel_id":{"description":"Funnel ID that was computed.","type":"string"},"funnel_name":{"description":"Display name of the funnel, when saved with one.","type":"string"},"funnel_url":{"description":"URL to view the funnel in the Fullstory UI.","type":"string"},"steps":{"description":"Per-step computed metrics in order.","items":{"description":"Per-step computed metrics in order.","properties":{"conversion_from_first":{"description":"Percent (0-100) of step 1 that also reached this step. Omitted for step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of the previous step that also reached this step. Omitted for step 1.","type":"number"},"groups":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","items":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","properties":{"conversion_from_first":{"description":"Percent (0-100) of this group at step 1 that also reached this step. Omitted for step 1 and when the group is absent at step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of this group at the previous step that also reached this step. Omitted for step 1 and when the group is absent earlier.","type":"number"},"group_value":{"description":"The dimension value for this group, e.g. \"Chrome\".","type":"string"},"user_count":{"description":"Count of users or sessions in this group that reached the step.","type":"number"}},"type":"object"},"type":"array"},"median_time_to_complete_from_first_ms":{"description":"Median milliseconds from step 1 to this step. Omitted for step 1 and when no data.","type":"integer"},"median_time_to_complete_from_previous_ms":{"description":"Median milliseconds from the previous step to this step. Omitted for step 1 and when no data.","type":"integer"},"previous":{"description":"Per-step computed metrics in order.","properties":{"conversion_from_first":{"description":"Percent (0-100) of step 1 that also reached this step. Omitted for step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of the previous step that also reached this step. Omitted for step 1.","type":"number"},"groups":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","items":{"description":"Per-group breakdown for this step when dimension is set. Omitted otherwise.","properties":{"conversion_from_first":{"description":"Percent (0-100) of this group at step 1 that also reached this step. Omitted for step 1 and when the group is absent at step 1.","type":"number"},"conversion_from_previous":{"description":"Percent (0-100) of this group at the previous step that also reached this step. Omitted for step 1 and when the group is absent earlier.","type":"number"},"group_value":{"description":"The dimension value for this group, e.g. \"Chrome\".","type":"string"},"user_count":{"description":"Count of users or sessions in this group that reached the step.","type":"number"}},"type":"object"},"type":"array"},"median_time_to_complete_from_first_ms":{"description":"Median milliseconds from step 1 to this step. Omitted for step 1 and when no data.","type":"integer"},"median_time_to_complete_from_previous_ms":{"description":"Median milliseconds from the previous step to this step. Omitted for step 1 and when no data.","type":"integer"},"previous":{"$comment":"recursion of $defs/FunnelStepResult unrolled to depth 2; anything deeper is not admitted (D306)","properties":{},"type":"object"},"step_number":{"description":"1-indexed step position in the funnel.","type":"integer"},"user_count":{"description":"Count of users or sessions (depending on the funnel's aggregation) that reached this step.","type":"number"}},"type":"object"},"step_number":{"description":"1-indexed step position in the funnel.","type":"integer"},"user_count":{"description":"Count of users or sessions (depending on the funnel's aggregation) that reached this step.","type":"number"}},"type":"object"},"type":"array"}},"type":"object"}
      - name: compute_journey
        native: [opaque]
        description: "Run a saved journey and return its step-by-step breakdown."
        mutating: false
        pin: ["org_id"]
        input_schema: {"type":"object","properties":{"direction":{"type":"string","description":"Override the journey's direction for this compute only: start (steps following the pivot) or end (steps preceding it).","enum":["start","end"]},"end_date":{"type":"string","description":"Custom range end date (ISO 8601, e.g. 2025-03-31). Must be paired with start_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"journey_definition":{"type":"object","properties":{},"description":"Escape hatch: a JourneyMap definition JSON (the shape build_journey returns as journey_definition). Mutually exclusive with journey_id."},"journey_id":{"type":"string","description":"ID of a saved journey returned by get_journey (named id or unnamed hash). Preferred over journey_definition."},"org_id":{"type":"string","description":"The Fullstory organization ID this call applies to. Omit to use the org associated with the current connection."},"per_step_limit":{"type":"integer","description":"Max number of distinct events shown per step (and per pivot); the rest roll into an \"Other\" bucket. Defaults to 5."},"start_date":{"type":"string","description":"Custom range start date (ISO 8601, e.g. 2025-01-01). Must be paired with end_date; the pair overrides time_range. Unpaired dates are ignored when time_range is set."},"steps":{"type":"integer","description":"Fan-out depth: how many steps to expand from the pivot. Defaults to 4, maximum 10."},"time_range":{"type":"string","description":"Override the journey's time range for this compute only. Does not modify the saved journey.","enum":["last_24_hours","last_day","last_7_days","last_30_days","last_90_days","last_year","this_month"]}}}
        output_type: fullstory.mcp.compute_journey.v1
