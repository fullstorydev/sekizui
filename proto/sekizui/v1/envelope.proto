syntax = "proto3";

package sekizui.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


// envelope.proto — the bus contract.
//
// DESIGN.md references: §4.6.1a-d, D19, D33, D40, D41, D42, D43.
//
// CloudEvents 1.0 shaped (D33) so it maps natively onto Kafka, Pub/Sub, NATS,
// and HTTP bindings without adapters.
//
// THE CENTRAL DESIGN DECISION (D40): the envelope is strictly typed; the payload
// is NOT. `data` is a Struct, described by a JSON Schema registered per
// (source, type, version) and loaded as configuration. Adding an event type is a
// schema file — no protobuf change, no codegen, no redeploy of core, and no fork
// for a third party adding their own source.
//
// The alternative (a typed `oneof` per event type) grows without bound and forces
// every self-hoster to fork. Rejected.

message Envelope {
  // --- CloudEvents required ---

  // Unique envelope ID (ULID — sortable, so it doubles as a coarse ordering key).
  string id = 1;

  // CloudEvents `source`: the target ref that produced this.
  // e.g. "fullstory:o-EXAMPLE-na1", "jira:acme".
  string source = 2;

  // CloudEvents spec version. "1.0".
  string spec_version = 3;

  // Versioned payload type: "fullstory.rage_click.v1" (D41).
  //
  // Evolution rules that make most changes non-events:
  //   - consumers MUST ignore unknown fields
  //   - adding an OPTIONAL field is not a version bump
  //   - removing / renaming / retyping / requiring a field IS
  //   - both versions may be published simultaneously during migration
  string type = 4;

  // --- CloudEvents optional ---

  // Primary entity this concerns: session ID, issue key, user ID.
  string subject = 5;

  // Event time at the source.
  google.protobuf.Timestamp time = 6;

  // URI of the registered JSON Schema describing `data` (D40).
  // CloudEvents `dataschema` — using the spec as intended, not bending it.
  string data_schema = 7;

  // The payload. Validated against data_schema at publish time.
  google.protobuf.Struct data = 8;

  // --- Sekizui extensions ---
  //
  // WARNING: CloudEvents extension attribute names must be lowercase
  // alphanumeric in several bindings — no underscores or dots. When mapping to a
  // binding these become `causationid`, `observedtime`, `traceid` (§4.6.1d).
  // Getting this wrong surfaces at Kafka-binding time, not here.

  // What produced this envelope, and how deep the chain is (D19).
  //
  // REQUIRED FROM v1. Reflex loop detection is impossible without it, and
  // retrofitting means a schema migration plus a window during which runaway
  // reflexes cannot be detected. This is the one field that must not be deferred.
  Causation causation = 9;

  // Pipeline stage, e.g. "raw", "enriched", "triaged", "judged".
  //
  // A STRING, not an enum (D43). Stages are a configured ordered list, so the set
  // is extensible — someone can insert "normalised" between raw and enriched
  // without touching this file. Monotonicity (D21) is checked against the
  // configured order.
  string stage = 10;

  // Residency classification, e.g. "eu", "us" (D29). Sinks and egress drivers
  // enforce it downstream; the audit sink must respect it too, or the audit log
  // itself becomes the violation.
  string residency = 11;

  // Correlates with Identity.trace_id and Decision.identity.trace_id.
  string trace_id = 12;

  // When Sekizui observed it, as distinct from `time` (when it happened).
  // The gap between these two is the ingest lag, and worth graphing.
  google.protobuf.Timestamp observed_time = 13;

  // Optional compact, token-budget-aware view for LLM consumption (§4.6.2).
  // Generated by a stateless enrichment reflex, not by translator code — so it is
  // data-defined and tunable per consumer.
  google.protobuf.Struct projection = 14;
}

// Causation records WHAT TRIGGERED something.
//
// Distinct from Identity.chain, which records WHO AUTHORISED it. A reflex firing
// on event E has chain ["reflex:R"] and causation E. Both are audited; they answer
// different incident-review questions.
message Causation {
  // The originating envelope at the root of this chain.
  string root_id = 1;

  // The immediate predecessor.
  string parent_id = 2;

  // Hop count from root. Capped to break runaway loops (§4.11.4 item 2).
  //
  // Note this is the BACKSTOP, not the primary guarantee. Cycles are prevented
  // structurally by stage monotonicity (D21); depth catches bugs and
  // agent-produced events re-entering the pipeline.
  uint32 depth = 3;

  // What emitted this: "translator:jira", "reflex:checkout-friction",
  // "command:<decision_id>", "agent:triage".
  string produced_by = 4;

  // The audit decision under which this envelope was produced — for a polled
  // envelope, the INTENT row its poll wrote before publishing (P3 step 7,
  // D272). Joinable to the log, where the intent's outcome says how many
  // events the poll published. Empty for an envelope no decision produced (a
  // reflex enrichment, which is not recorded per envelope).
  string decision_id = 5;
}
